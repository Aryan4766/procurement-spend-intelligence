# Company A - mining operations, ZAR, two systems (SAP goods receipts + accounts-payable invoice tool).
extends: common.yaml
company_id: A
reporting_currency: ZAR
data_dir: ../../company_A          # override with --data-dir; the data is confidential and never committed

taxonomy:
  file: taxonomy_A.csv
  level_columns: [category_l1, category_l2, category_l3]

# Optional labels: used ONLY for training (supervised mode) and for evaluation. Ignored with --zero-label.
labels:
  file: labels_A.csv
  id_column: record_id
  level_columns: [category_l1, category_l2, category_l3]
  supplier_key_column: supplier_key
  item_key_column: item_key

sources:
  - name: erp
    role: primary
    file: erp_goods_receipts.csv
    id_column: line_id
    record_id_template: "ERP:{id}"
    fields:
      description: [material_short_text, service_short_text]
      supplier_name: supplier_name
      supplier_id: vendor_id
      item_code: material_number
      quantity: quantity
      uom: uom
      date: posting_date
      po: po_number
      po_item: po_item
      amount: value_zar
      system: source_system
    context_fields:
      spend_type: spend_type
      material_type: material_type
      contract_number: contract_number
      uom: uom
      cost_centre: cost_centre
    amount:
      basis: net                  # ERP values are already net of tax: never remove VAT again
      currency: ZAR
    date_formats: ["%Y-%m-%d"]
    # A goods receipt is identified by PO line + receipt document line; identical re-exports are dropped
    duplicate_key: [po_number, po_item, receipt_document, receipt_item, material_number, quantity, value_zar]

  - name: tool
    role: secondary
    file: invoice_tool_export.csv
    id_column: tool_record_id
    record_id_template: "TOOL:{id}"
    fields:
      description: line_text
      supplier_name: supplier_name_as_captured
      quantity: quantity
      date: invoice_date
      po: po_reference
      invoice_number: invoice_number
      amount: gross_amount
      vat_rate: vat_rate
      status: status
    amount:
      basis: gross                # remove VAT at the rate shown
      vat_default: 0.15           # brief: blank rate -> 15 %. An explicit 0 is a real zero-rated line.
      currency_column: currency   # all ZAR here
    date_formats: ["%d/%m/%Y", "%Y-%m-%d", "%d-%b-%y"]
    status:
      approved: [approved, paid]
      cancelled: [cancelled]

fx:                               # not needed for A (all ZAR) - kept so a currency_column other than ZAR fails loudly
  semantics: units_per_reporting

matching:
  enabled: true
  po_regex: '(\d{8,12})'          # the PO core, ignoring "PO#", "PO ", "/10.0" line suffixes
  po_item_regex: '/(\d+)'
  amount_tolerance_abs: 0.05      # rounding of gross->net differs by a cent or two between systems
  amount_tolerance_rel: 0.0002
  supplier_match_min: 0.80
  text_match_min: 0.55
  accept_score: 0.70
  ambiguous_score: 0.50
  max_subset_lines: 14            # one invoice line may settle several goods-receipt lines of the same PO
  date_window_days: 365

entity_resolution:
  supplier:
    name_threshold: 92            # rapidfuzz ratio on compacted normalised names
    min_len_fuzzy: 7
  item:
    desc_threshold: 93
    use_item_code: true

classification:
  mode: auto                      # supervised+semantic when labels exist, zero-label otherwise
  context_fields: [ctx_material_type, ctx_spend_type, supplier_key]   # extra evidence for the supervised models
  fallback_fields: [ctx_material_type]
  embed_prefix_fields: [ctx_spend_type, ctx_material_type]            # metadata prefix for the semantic priors (E5)                                 # used when a description says nothing
